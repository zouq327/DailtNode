
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动态条件查询表格</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>
  <style>
    .app-container {
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .filter-container {
      margin-bottom: 20px;
      padding: 20px;
      background: #f5f7fa;
      border-radius: 4px;
    }
    .dynamic-form-item {
      margin-right: 10px;
      margin-bottom: 10px;
      display: inline-block;
    }
    .el-table {
      margin-top: 20px;
    }
    .form-config-panel {
      margin-top: 20px;
      padding: 15px;
      border: 1px dashed #dcdfe6;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app" class="app-container">
    <h2>动态条件查询表格</h2>
    

    <!-- 动态查询条件区域 -->
    <div class="filter-container">
      <el-form :inline="true" :model="searchForm" ref="searchForm">
        <template v-for="(item, index) in formItems">
          <el-form-item 
            :label="item.label" 
            :key="index"
            :prop="item.prop"
            class="dynamic-form-item">
            
            <template v-if="item.type === 'input'">
              <el-input 
                v-model="searchForm[item.prop]" 
                :placeholder="'请输入'+item.label"
                clearable>
              </el-input>
            </template>
            
            <template v-else-if="item.type === 'select'">
              <el-select 
                v-model="searchForm[item.prop]" 
                :placeholder="'请选择'+item.label"
                clearable>
                <el-option
                  v-for="opt in item.options"
                  :key="opt.value"
                  :label="opt.label"
                  :value="opt.value">
                </el-option>
              </el-select>
            </template>
            
            <template v-else-if="item.type === 'date'">
              <el-date-picker
                v-model="searchForm[item.prop]"
                type="date"
                :placeholder="'选择'+item.label">
              </el-date-picker>
            </template>
            
          </el-form-item>
        </template>

        <el-form-item>
          <el-button type="primary" @click="handleSearch">查询</el-button>
          <el-button @click="resetSearch">重置</el-button>
        </el-form-item>
      </el-form>
    </div>
    
    <!-- 表格区域 -->
    <el-table
      :data="filteredData"
      border
      style="width: 100%"
      v-loading="loading"
      :key="tableKey">
      <el-table-column
        v-for="column in tableColumns"
        :key="column.prop"
        :prop="column.prop"
        :label="column.label"
        :width="column.width">
      </el-table-column>
    </el-table>
    
    <!-- 分页区域 -->
    <el-pagination
      @size-change="handleSizeChange"
      @current-change="handleCurrentChange"
      :current-page="currentPage"
      :page-sizes="[5, 10, 20, 50]"
      :page-size="pageSize"
      layout="total, sizes, prev, pager, next, jumper"
      :total="total">
    </el-pagination>
  </div>

  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          // 原始数据
          originalData: [
            { id: 1, name: '张三', age: 25, gender: '男', address: '北京市海淀区', status: '在职', date: '2025-01-15' },
            { id: 2, name: '李四', age: 30, gender: '女', address: '上海市浦东新区', status: '离职', date: '2025-02-20' },
            { id: 3, name: '王五', age: 28, gender: '男', address: '广州市天河区', status: '在职', date: '2025-03-10' },
            { id: 4, name: '赵六', age: 35, gender: '女', address: '深圳市南山区', status: '休假', date: '2025-04-05' },
            { id: 5, name: '钱七', age: 22, gender: '男', address: '杭州市西湖区', status: '在职', date: '2025-05-12' },
            { id: 6, name: '孙八', age: 29, gender: '女', address: '成都市武侯区', status: '在职', date: '2025-06-18' },
            { id: 7, name: '周九', age: 31, gender: '男', address: '武汉市洪山区', status: '离职', date: '2025-07-22' },
            { id: 8, name: '吴十', age: 27, gender: '女', address: '南京市鼓楼区', status: '在职', date: '2025-08-08' }
          ],
          // 动态表单配置
          formItems: [
            { 
              label: '姓名', 
              prop: 'name', 
              type: 'input'
            },
            { 
              label: '性别', 
              prop: 'gender', 
              type: 'select',
              options: [
                { label: '男', value: '男' },
                { label: '女', value: '女' }
              ]
            },
            { 
              label: '状态', 
              prop: 'status', 
              type: 'select',
              options: [
                { label: '在职', value: '在职' },
                { label: '离职', value: '离职' },
                { label: '休假', value: '休假' }
              ]
            }
          ],
          // 查询表单数据
          searchForm: {
            name: '',
            gender: '',
            status: '',
            minAge: null,
            maxAge: null,
            dateRange: []
          },
          // 表格列配置
          tableColumns: [
            { prop: 'id', label: 'ID', width: '80' },
            { prop: 'name', label: '姓名', width: '120' },
            { prop: 'age', label: '年龄', width: '80' },
            { prop: 'gender', label: '性别', width: '80' },
            { prop: 'status', label: '状态', width: '100' },
            { prop: 'address', label: '地址' },
            { prop: 'date', label: '注册日期', width: '180' }
          ],
          // 分页相关
          currentPage: 1,
          pageSize: 5,
          loading: false,
          tableKey: 1,
          // 高级查询配置
          showAdvanced: false,
          showDateRange: false
        }
      },
      computed: {
        // 过滤后的数据
        filteredData() {
          let result = [...this.originalData];
          
          // 动态表单条件过滤
          this.formItems.forEach(item => {
            if (this.searchForm[item.prop]) {
              result = result.filter(row => 
                String(row[item.prop]).includes(this.searchForm[item.prop])
              );
            }
          });
          
          // 高级条件过滤
          if (this.showAdvanced) {
            if (this.searchForm.minAge) {
              result = result.filter(item => item.age >= this.searchForm.minAge);
            }
            if (this.searchForm.maxAge) {
              result = result.filter(item => item.age <= this.searchForm.maxAge);
            }
            if (this.showDateRange && this.searchForm.dateRange && this.searchForm.dateRange.length === 2) {
              const [start, end] = this.searchForm.dateRange;
              result = result.filter(item => {
                const itemDate = new Date(item.date);
                return itemDate >= new Date(start) && itemDate <= new Date(end);
              });
            }
          }
          
          // 分页处理
          this.total = result.length;
          return result.slice(
            (this.currentPage - 1) * this.pageSize,
            this.currentPage * this.pageSize
          );
        },
        // 总条数
        total: {
          get() {
            return this._total || this.originalData.length;
          },
          set(val) {
            this._total = val;
          }
        }
      },
      methods: {
        // 查询方法
        handleSearch() {
          this.loading = true;
          // 模拟异步请求
          setTimeout(() => {
            this.currentPage = 1;
            this.loading = false;
          }, 300);
        },
        // 重置查询条件
        resetSearch() {
          Object.keys(this.searchForm).forEach(key => {
            if (Array.isArray(this.searchForm[key])) {
              this.searchForm[key] = [];
            } else {
              this.searchForm[key] = '';
            }
          });
          this.currentPage = 1;
        },
        // 分页大小改变
        handleSizeChange(val) {
          this.pageSize = val;
        },
        // 当前页改变
        handleCurrentChange(val) {
          this.currentPage = val;
        }
      }
    });
  </script>
</body>
</html>
